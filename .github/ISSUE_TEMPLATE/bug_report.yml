name: Bug report
description: Report a defect in pedotri.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more specific you can be, the faster this gets fixed.
  - type: input
    id: version
    attributes:
      label: pedotri version
      description: Output of `python -c "import pedotri; print(pedotri.__version__)"`
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: "3.11.14"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "macOS 14 / Ubuntu 22.04 / Windows 11"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Smallest code snippet that triggers the issue. Please include the full traceback if applicable.
      render: python
      placeholder: |
        import pedotri

        pedotri.classify(60, 20, "USDA")
        # → expected: 'sandy_clay_loam', got: ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Include any error output verbatim.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: |
        Optional: which classification, which optional extras (`matplotlib` / `plotly` / `pandas` / `polars` / `mcp`) you have installed, related references, screenshots, etc.
    validations:
      required: false
