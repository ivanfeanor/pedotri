site_name: pedotri
site_description: Modern soil texture classification and pedotransfer functions for Python
site_url: https://ivanfeanor.github.io/pedotri/
repo_url: https://github.com/ivanfeanor/pedotri
repo_name: ivanfeanor/pedotri
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Ivan Kolomiets

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - Classifications:
      - Built-in: classifications/builtin.md
      - Custom (TOML): classifications/custom.md
      - i18n: classifications/i18n.md
  - Pedotransfer functions: ptf.md
  - Plotting: plotting.md
  - CLI: cli.md
  - API reference: api.md
