[project]
name = "pedotri"
version = "0.4.1"
description = "Modern, extensible soil texture classification and pedotransfer functions for Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Ivan Kolomiets", email = "ieee802@yandex.ru" },
]
keywords = [
    "soil",
    "texture",
    "classification",
    "agronomy",
    "pedology",
    "agriculture",
    "agritech",
    "pedotransfer",
    "hydrology",
    "USDA",
    "FAO",
    "ISSS",
    "GEPPA",
    "Jamagne",
    "Kachinsky",
    "HYPRES",
    "KA5",
    "Embrapa",
    "Northcote",
    "mcp",
    "llm",
    "claude",
    "agent",
    "tool-use",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
matplotlib = ["matplotlib>=3.7"]
plotly = ["plotly>=5.18"]
pandas = ["pandas>=2.0"]
polars = ["polars>=0.20"]
mcp = ["mcp>=1.0", "matplotlib>=3.7"]
raster = ["rasterio>=1.3", "scipy>=1.10"]
vector = ["shapely>=2.0", "fiona>=1.9"]
interp = ["pykrige>=1.7", "scipy>=1.10", "rasterio>=1.3"]
all = [
    "matplotlib>=3.7",
    "plotly>=5.18",
    "pandas>=2.0",
    "polars>=0.20",
    "mcp>=1.0",
    "rasterio>=1.3",
    "scipy>=1.10",
    "shapely>=2.0",
    "fiona>=1.9",
    "pykrige>=1.7",
]

[project.scripts]
pedotri = "pedotri.cli:main"
pedotri-mcp = "pedotri.mcp_server:main"

[project.urls]
Homepage = "https://github.com/ivanfeanor/pedotri"
Repository = "https://github.com/ivanfeanor/pedotri"
Issues = "https://github.com/ivanfeanor/pedotri/issues"
Documentation = "https://ivanfeanor.github.io/pedotri/"

[build-system]
requires = ["uv_build>=0.11.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.6",
    "matplotlib>=3.7",
    "plotly>=5.18",
    "pandas>=2.0",
    "polars>=0.20",
    "mcp>=1.0",
    "rasterio>=1.3",
    "soiltexture>=1.0.4",
    "scipy>=1.10",
    "shapely>=2.0",
    "fiona>=1.9",
    "pykrige>=1.7",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[tool.uv.build-backend]
module-name = "pedotri"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "N",     # pep8-naming
    "RUF",   # ruff-specific
    "SIM",   # flake8-simplify
    "PT",    # pytest-style
    "PTH",   # use pathlib
    "TID",   # tidy imports
    "TC",    # type-checking imports
    "PERF",  # perflint
    "FURB",  # refurb
    "PL",    # pylint subset
]
ignore = [
    "PLR0913",  # too many arguments
    "PLR2004",  # magic value comparisons (frequent in geometry)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR2004", "S101", "PLC0415", "RUF001", "RUF002", "RUF003", "RUF043", "N806",
]
# Example scripts prioritize readability over strict-lint compliance.
# Lazy matplotlib imports, "×" for visual clarity in titles / docstrings,
# and unstrict zip() are deliberate.
"examples/**" = ["PLC0415", "RUF001", "RUF002", "RUF003", "B905"]
# Optional plotting backends deliberately defer their imports so the
# heavy dependency is only paid for when the user calls the function.
"src/pedotri/plot/__init__.py" = ["PLC0415"]
"src/pedotri/plot/mpl.py" = ["PLC0415"]
"src/pedotri/plot/plotly_backend.py" = ["PLC0415"]
# MCP SDK is an optional extra; mcp_server lazy-imports it inside the
# builder function so `import pedotri` always works without the SDK.
"src/pedotri/mcp_server.py" = ["PLC0415"]
# rasterio is an optional extra; raster.py defers the import so the
# core package still loads without GDAL on the system. RUF001-003 cover
# the scientific notation (σ, ×, −) in docstrings, mirroring the policy
# applied to uncertainty.py and zonal.py for the same reason.
"src/pedotri/raster.py" = ["PLC0415", "RUF001", "RUF002", "RUF003"]
# bench.py optionally pulls in soiltexture for the head-to-head
# benchmark; the import is conditional on user installation.
"src/pedotri/bench.py" = ["PLC0415"]
# interp.py optionally pulls in pykrige + scipy; lazy import so the
# core package loads without them.
"src/pedotri/interp.py" = ["PLC0415"]
# The 0.3 surface uses scientific notation (σ, Q05/Q95, ×, −) heavily
# in docstrings and module-level prose, and lazy-imports optional
# extras (rasterio, urllib.error wrappers, SoilGrids fetcher). Same
# rationale as the modules above.
"src/pedotri/uncertainty.py" = ["RUF001", "RUF002", "RUF003"]
"src/pedotri/zonal.py" = ["PLC0415", "RUF001", "RUF002", "RUF003"]
"src/pedotri/classifier.py" = ["PLC0415", "RUF001", "RUF002", "RUF003"]
"src/pedotri/ai.py" = ["PLC0415"]
"src/pedotri/sources/soilgrids.py" = ["PLC0415", "RUF001", "RUF002", "RUF003"]
"src/pedotri/sources/worldcover.py" = ["PLC0415", "RUF001", "RUF002", "RUF003"]
# 0.4 surface — DEM, grid, audit, dem.py uses scientific notation
# (Greek symbols, math operators) heavily in docstrings; uncertainty
# / zonal extended with correlated sampling have lazy scipy /
# rasterio imports inside helpers.
"src/pedotri/dem.py" = ["RUF001", "RUF002", "RUF003", "N803", "N806"]
"src/pedotri/grid.py" = ["PLC0415", "RUF001", "RUF002", "RUF003", "F401"]
"src/pedotri/audit.py" = ["PLC0415", "PLR0911", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_decorators = true
disallow_any_generics = true
show_error_codes = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "plotly.*",
    "pandas.*",
    "polars.*",
    "rasterio.*",
    "soiltexture.*",
    "scipy.*",
    "shapely.*",
    "fiona.*",
    "pykrige.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
testpaths = ["tests"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["pedotri"]
branch = true
omit = ["*/_types.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
