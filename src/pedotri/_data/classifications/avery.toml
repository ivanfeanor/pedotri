# Avery 1980 — UK Soil Survey of England and Wales.
#
# Twelve textural classes used by the UK Soil Survey and ADAS for
# agronomic soil description. Polygon boundaries follow the USDA
# texture triangle almost exactly; the distinguishing features are
# British nomenclature and the "Z" prefix denoting silt-rich classes
# (from German *Schluff*).

[meta]
key = "AVERY"
axes = ["sand", "clay"]
default_locale = "en"
reference = "Avery, B.W. (1980). Soil classification for England and Wales (higher categories). Soil Survey Technical Monograph No. 14. Soil Survey of England and Wales, Harpenden."
description = "Twelve-class British classification per Avery 1980. Boundaries are geometrically identical to USDA; class codes follow the British convention where 'Z' denotes silt-rich classes (e.g. ZL = silty loam, ZC = silty clay)."

[meta.names]
en = "Avery (UK Soil Survey 1980)"
fr = "Avery (Royaume-Uni 1980)"
de = "Avery (UK Bodenkartierung 1980)"
es = "Avery (Reino Unido 1980)"
ru = "Эйвери (Великобритания, 1980)"
pt = "Avery (Reino Unido 1980)"

[[class]]
key = "C"
group = "fine"
vertices = [[0, 100], [0, 60], [20, 40], [45, 40], [45, 55]]
[class.names]
en = "clay"
fr = "argile"
de = "Ton"
es = "arcilla"
ru = "глина"
pt = "argila"

[[class]]
key = "ZC"
group = "fine"
vertices = [[0, 60], [0, 40], [20, 40]]
[class.names]
en = "silty clay"
fr = "argile silteuse"
de = "schluffiger Ton"
es = "arcilla limosa"
ru = "пылеватая глина"
pt = "argila siltosa"

[[class]]
key = "ZCL"
group = "moderately_fine"
vertices = [[0, 40], [0, 27], [20, 27], [20, 40]]
[class.names]
en = "silty clay loam"
fr = "limon argilo-silteux"
de = "schluffiger Tonlehm"
es = "franco arcillo-limoso"
ru = "пылеватый тяжёлый суглинок"
pt = "franco argilo-siltoso"

[[class]]
key = "SC"
group = "fine"
vertices = [[45, 55], [45, 35], [65, 35]]
[class.names]
en = "sandy clay"
fr = "argile sableuse"
de = "sandiger Ton"
es = "arcilla arenosa"
ru = "песчаная глина"
pt = "argila arenosa"

[[class]]
key = "SCL"
group = "moderately_fine"
vertices = [[45, 35], [45, 27], [52, 20], [80, 20], [65, 35]]
[class.names]
en = "sandy clay loam"
fr = "limon argilo-sableux"
de = "sandiger Tonlehm"
es = "franco arcillo-arenoso"
ru = "песчаный тяжёлый суглинок"
pt = "franco argilo-arenoso"

[[class]]
key = "CL"
group = "moderately_fine"
vertices = [[20, 40], [20, 27], [45, 27], [45, 40]]
[class.names]
en = "clay loam"
fr = "limon argileux"
de = "Tonlehm"
es = "franco arcilloso"
ru = "тяжёлый суглинок"
pt = "franco argiloso"

[[class]]
key = "Z"
group = "medium"
vertices = [[0, 12], [0, 0], [20, 0], [8, 12]]
[class.names]
en = "silt"
fr = "silt"
de = "Schluff"
es = "limo"
ru = "пыль"
