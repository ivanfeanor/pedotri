# GEPPA-Jamagne — French soil texture triangle.
#
# Fourteen classes laid out on the sand-clay plane along the breakpoints
# canonically used in French pedology (clay axis cuts at 7.5, 17.5, 30,
# 45, 60 %; sand axis cuts at 30, 50, 65, 85 %). Triangle corners that
# would exceed sand + clay = 100 % are clipped to the diagonal.
#
# This triangle is sometimes called the "GEPPA-Aisne" triangle after the
# Groupe d'Étude des Problèmes de Pédologie Appliquée's Aisne working
# group. The class codes follow the convention from Baize & Jamagne
# (1995).

[meta]
key = "GEPPA"
axes = ["sand", "clay"]
default_locale = "fr"
reference = "Jamagne, M. (1967). Bases et techniques d'une cartographie des sols. Annales agronomiques 18 (numéro spécial). Updated in Baize, D. & Jamagne, M. (1995). Référentiel pédologique. INRA, Paris."
url = "https://www.afes.fr/"
description = "French soil texture classification with 14 named classes covering the full sand-silt-clay simplex. Native locale is French; English glosses are provided as guidance and are not perfect equivalents (notably French 'limon' covers what USDA calls 'silt loam', not 'loam')."

[meta.names]
fr = "GEPPA-Jamagne"
en = "GEPPA-Jamagne"
de = "GEPPA-Jamagne"
es = "GEPPA-Jamagne"
ru = "GEPPA-Jamagne"
pt = "GEPPA-Jamagne"

# --- Argileux (clay-rich, clay >= 45%) -----------------------------------

[[class]]
key = "AA"
group = "fine"
vertices = [[0, 60], [40, 60], [0, 100]]
[class.names]
fr = "argile lourde"
en = "heavy clay"
de = "schwerer Ton"
es = "arcilla pesada"
ru = "тяжёлая глина"
pt = "argila pesada"

[[class]]
key = "A"
group = "fine"
vertices = [[0, 45], [55, 45], [40, 60], [0, 60]]
[class.names]
fr = "argile"
en = "clay"
de = "Ton"
es = "arcilla"
ru = "глина"
pt = "argila"

