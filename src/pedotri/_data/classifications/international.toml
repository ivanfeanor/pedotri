# International soil texture classification (Davis-Bennett / Leeper-Uren).
#
# Used historically in Australia and parts of the Commonwealth. Uses a
# different sand/silt cutoff (0.02 mm) than USDA (0.05 mm), so converting
# inputs may be required when classifying particle-size data measured
# against the USDA standard.

[meta]
key = "INTERNATIONAL"
axes = ["sand", "clay"]
default_locale = "en"
reference = "Leeper, G.W. and Uren, N.C. (1993). Soil Science: An Introduction (5th ed.). Melbourne University Press, Carlton."
description = "Eleven-class international texture triangle. Sand 0.02-2.0 mm, silt 0.002-0.02 mm, clay <0.002 mm — the 0.02 mm sand-silt boundary differs from USDA's 0.05 mm cutoff."

[meta.names]
en = "International"
fr = "International"
de = "International"
es = "Internacional"
ru = "Международная"
pt = "Internacional"

[[class]]
key = "clay"
group = "fine"
vertices = [[0, 75], [35, 40], [63, 31], [50, 50], [0, 100]]
[class.names]
en = "clay"
fr = "argile"
de = "Ton"
es = "arcilla"
ru = "глина"
pt = "argila"

[[class]]
key = "silty_clay"
group = "fine"
vertices = [[0, 40], [35, 40], [0, 75]]
[class.names]
