# ISSS — International Society of Soil Science texture classification.
#
# Twelve-class triangle adopted for European soil mapping. Like the
# INTERNATIONAL system it uses a 0.02 mm sand-silt cutoff rather than
# USDA's 0.05 mm — particle-size analyses run against USDA standards
# need conversion before classifying with ISSS.

[meta]
key = "ISSS"
axes = ["sand", "clay"]
default_locale = "en"
reference = "Verheye, W. and Ameryckx, J. (1984). Mineral fractions and classification of soil texture. Pedologie 34(2): 215-225. Adopted by the International Society of Soil Science."
description = "ISSS twelve-class classification. Sand 0.02-2.0 mm, silt 0.002-0.02 mm, clay <0.002 mm."

[meta.names]
en = "ISSS"
fr = "ISSS"
de = "ISSS"
es = "ISSS"
ru = "ISSS"
pt = "ISSS"

[[class]]
key = "heavy_clay"
group = "fine"
vertices = [[0, 100], [0, 45], [55, 45]]
[class.names]
en = "heavy clay"
fr = "argile lourde"
de = "schwerer Ton"
es = "arcilla pesada"
ru = "тяжёлая глина"
pt = "argila pesada"

[[class]]
key = "sandy_clay"
group = "fine"
vertices = [[55, 45], [75, 25], [55, 25]]
[class.names]
en = "sandy clay"
fr = "argile sableuse"
de = "sandiger Ton"
es = "arcilla arenosa"
ru = "песчаная глина"
pt = "argila arenosa"

