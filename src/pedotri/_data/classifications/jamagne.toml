# Jamagne 1967 — original French soil texture triangle.
#
# The historical 13-class French texture triangle from Marcel Jamagne's
# 1967 paper. Distinct from the modern GEPPA-Aisne refinement (shipped
# as the ``GEPPA`` classification) chiefly in that Jamagne 1967 treats
# all soils with clay > 45 % as a single "argile" (A) class, where
# Baize & Jamagne (1995) later split that into an additional "argile
# lourde" (AA) class for clay > 60 %.
#
# Polygons are best-effort transcriptions of the canonical breakpoints
# used in French agronomy textbooks citing the 1967 paper. For the
# modern refinement see :class:`pedotri._data.classifications.geppa`.

[meta]
key = "JAMAGNE"
axes = ["sand", "clay"]
default_locale = "fr"
reference = "Jamagne, M. (1967). Bases et techniques d'une cartographie des sols. Annales agronomiques, vol. 18, numéro spécial. INRA, Paris."
description = "Historical French texture triangle by Marcel Jamagne (1967). The modern GEPPA-Aisne refinement is available as the GEPPA classification."

[meta.names]
fr = "Jamagne 1967"
en = "Jamagne 1967"
de = "Jamagne 1967"
es = "Jamagne 1967"
ru = "Jamagne 1967"
pt = "Jamagne 1967"

# --- Argile (clay >= 45%) ------------------------------------------------

[[class]]
key = "A"
group = "fine"
vertices = [[0, 45], [55, 45], [0, 100]]
[class.names]
fr = "argile"
en = "clay"
de = "Ton"
es = "arcilla"
ru = "глина"
pt = "argila"

# --- Argilo-X (clay 30-45%) ----------------------------------------------

[[class]]
key = "AL"
group = "moderately_fine"
vertices = [[0, 30], [50, 30], [50, 45], [0, 45]]
[class.names]
fr = "argile limoneuse"
en = "silty clay"
de = "schluffiger Ton"
es = "arcilla limosa"
ru = "пылеватая глина"
pt = "argila siltosa"

[[class]]
key = "AS"
group = "moderately_fine"
vertices = [[50, 30], [70, 30], [55, 45], [50, 45]]
[class.names]
fr = "argile sableuse"
en = "sandy clay"
de = "sandiger Ton"
es = "arcilla arenosa"
ru = "песчаная глина"
pt = "argila arenosa"

