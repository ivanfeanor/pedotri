vertices = [[0, 17.5], [50, 17.5], [50, 30], [0, 30]]
[class.names]
fr = "limon argileux"
en = "silty clay loam"
de = "schluffiger Tonlehm"
es = "franco arcillo-limoso"
ru = "пылеватый тяжёлый суглинок"
pt = "franco argilo-siltoso"

[[class]]
key = "LAS"
group = "medium_fine"
vertices = [[50, 17.5], [65, 17.5], [65, 30], [50, 30]]
[class.names]
fr = "limon argilo-sableux"
en = "sandy clay loam (silty)"
de = "sandig-schluffiger Tonlehm"
es = "franco arcillo-arenoso (limoso)"
ru = "песчано-пылеватый тяжёлый суглинок"
pt = "franco argilo-arenoso (siltoso)"

[[class]]
key = "SA"
group = "medium_fine"
vertices = [[65, 17.5], [82.5, 17.5], [70, 30], [65, 30]]
[class.names]
fr = "sablo-argileux"
en = "sandy clay loam"
de = "sandiger Lehm (tonreich)"
es = "franco arcillo-arenoso"
ru = "песчано-суглинистый"
pt = "franco argilo-arenoso"

