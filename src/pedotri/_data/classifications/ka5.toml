# KA5 — Bodenkundliche Kartieranleitung, 5. Auflage (2005).
#
# Full 31-class German pedological texture classification. Class
# definitions are given in the KA5 reference as clay and silt percent
# ranges; the polygons below convert each rectangular (clay, silt)
# region into the equivalent (sand, clay) polygon (sand = 100 - clay -
# silt) clipped to the sand-silt-clay simplex.
#
# Class groups by initial letter:
#   S* — Sande (sands)
#   L* — Lehme (loams)
#   U* — Schluffe (silts)
#   T* — Tone (clays)

[meta]
key = "KA5"
axes = ["sand", "clay"]
default_locale = "de"
reference = "Ad-hoc-AG Boden (2005). Bodenkundliche Kartieranleitung, 5. Auflage (KA5). Hannover: Bundesanstalt für Geowissenschaften und Rohstoffe & Staatliche Geologische Dienste der Bundesländer."
description = "German Soil Mapping Guide (Kartieranleitung 5), 2005. Full 31-class textural classification used by BGR and the German state geological surveys."

[meta.names]
de = "KA5 (Bodenkundliche Kartieranleitung 5)"
en = "KA5 (German Soil Mapping Guide, 5th ed.)"
fr = "KA5 (cartographie des sols, Allemagne)"
es = "KA5 (cartografía de suelos, Alemania)"
ru = "KA5 (немецкая почвенная классификация)"
pt = "KA5 (cartografia de solos, Alemanha)"

