[class.names]
ru = "суглинок тяжёлый"
en = "heavy loam"
fr = "limon lourd"
de = "schwerer Lehm"
es = "franco pesado"
pt = "franco pesado"

[[class]]
key = "light_clay"
group = "fine"
interval = [50, 65]
[class.names]
ru = "глина лёгкая"
en = "light clay"
fr = "argile légère"
de = "leichter Ton"
es = "arcilla ligera"
pt = "argila leve"

[[class]]
key = "medium_clay"
group = "fine"
interval = [65, 80]
[class.names]
ru = "глина средняя"
en = "medium clay"
fr = "argile moyenne"
de = "mittlerer Ton"
