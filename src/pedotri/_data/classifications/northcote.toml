# Northcote — Australian factual-key soil texture classification.
#
# Sixteen field-texture classes from Northcote's *A Factual Key for the
# Recognition of Australian Soils* (4th ed., 1979), as commonly mapped
# onto the sand-silt-clay simplex in Australian soil-survey practice.
# The distinguishing feature relative to USDA is a finer subdivision of
# the clay-rich top of the triangle (HC / MHC / MC / LMC / LC), useful
# for the heavy soils common across southern and eastern Australia.

[meta]
key = "NORTHCOTE"
axes = ["sand", "clay"]
default_locale = "en"
reference = "Northcote, K.H. (1979). A Factual Key for the Recognition of Australian Soils (4th ed.). Rellim Technical Publications, Glenside, South Australia."
description = "Australian 16-class field-texture grading. Polygons map field-grade boundaries onto sand and clay percentages and provide five clay subdivisions (Heavy / Medium-Heavy / Medium / Light-Medium / Light Clay) above the 35 % clay line."

[meta.names]
en = "Northcote"
fr = "Northcote"
de = "Northcote"
es = "Northcote"
ru = "Northcote"
pt = "Northcote"

# --- Clay subdivisions (clay > 35%) --------------------------------------

[[class]]
key = "HC"
group = "fine"
vertices = [[0, 60], [40, 60], [0, 100]]
[class.names]
en = "heavy clay"
fr = "argile lourde"
de = "schwerer Ton"
es = "arcilla pesada"
ru = "тяжёлая глина"
pt = "argila pesada"

[[class]]
key = "MHC"
group = "fine"
vertices = [[0, 50], [50, 50], [40, 60], [0, 60]]
[class.names]
en = "medium-heavy clay"
fr = "argile moyenne-lourde"
de = "mittel-schwerer Ton"
es = "arcilla medio-pesada"
ru = "среднетяжёлая глина"
pt = "argila médio-pesada"

[[class]]
key = "MC"
group = "fine"
vertices = [[0, 45], [55, 45], [50, 50], [0, 50]]
[class.names]
en = "medium clay"
fr = "argile moyenne"
de = "mittlerer Ton"
es = "arcilla media"
ru = "средняя глина"
pt = "argila média"

[[class]]
key = "LMC"
group = "fine"
vertices = [[0, 40], [60, 40], [55, 45], [0, 45]]
[class.names]
en = "light-medium clay"
fr = "argile légère-moyenne"
de = "leicht-mittlerer Ton"
es = "arcilla ligero-media"
ru = "лёгко-средняя глина"
pt = "argila leve-média"

[[class]]
key = "LC"
group = "fine"
vertices = [[0, 35], [65, 35], [60, 40], [0, 40]]
[class.names]
en = "light clay"
fr = "argile légère"
de = "leichter Ton"
es = "arcilla ligera"
ru = "лёгкая глина"
pt = "argila leve"

