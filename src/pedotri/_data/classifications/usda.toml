# USDA soil texture classification.
#
# Twelve classes defined by sand-clay percentages, used worldwide as the
# de facto standard. Polygon vertices in (sand %, clay %) plane.
# Silt is implicit: silt = 100 - sand - clay.

[meta]
key = "USDA"
axes = ["sand", "clay"]
default_locale = "en"
reference = "Soil Survey Division Staff (1993). Soil Survey Manual. USDA Agriculture Handbook 18. U.S. Government Printing Office, Washington, DC."
url = "https://www.nrcs.usda.gov/resources/guides-and-instructions/soil-survey-manual"
description = "Standard USDA texture triangle: 12 classes covering the full sand-silt-clay simplex. The most widely used soil texture classification system worldwide. Particle-size fractions: sand 0.05-2.0 mm; silt 0.002-0.05 mm; clay <0.002 mm."

[meta.names]
en = "USDA"
fr = "USDA"
de = "USDA"
es = "USDA"
ru = "USDA"
pt = "USDA"

[[class]]
key = "clay"
group = "fine"
vertices = [[0, 100], [0, 60], [20, 40], [45, 40], [45, 55]]
[class.names]
en = "clay"
fr = "argile"
de = "Ton"
es = "arcilla"
ru = "глина"
pt = "argila"

[[class]]
